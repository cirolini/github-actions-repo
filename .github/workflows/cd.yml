# Workflow 3 de 3 — ENTREGA CONTÍNUA
# Gera o artefato e publica. Repare na diferença conceitual:
#   - o job "empacotar" roda sozinho (automático)
#   - o job "publicar" espera aprovação humana (environment protegido)
# Isso é ENTREGA contínua. Removendo a aprovação, vira IMPLANTAÇÃO contínua.
name: CD

on:
  push:
    tags: ["v*"]
  # Permite disparar manualmente pela aba Actions, útil para demonstração.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empacotar:
    name: Gerar artefato
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Revalida antes de empacotar: nunca gere artefato de código quebrado.
      - name: Validar antes de empacotar
        env:
          PYTHONPATH: src
        run: |
          ruff check .
          python -m unittest discover -s tests

      - name: Construir o pacote
        run: python -m build

      # O artefato é construído UMA vez e promovido entre ambientes.
      # Reconstruir a cada ambiente quebra a garantia de que o que foi
      # testado é exatamente o que vai para produção.
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: pacote-cotacao
          path: dist/
          retention-days: 30

  publicar:
    name: Publicar em produção
    needs: empacotar
    runs-on: ubuntu-latest
    # Configure o environment "producao" em Settings > Environments e
    # marque "Required reviewers" para que este job aguarde aprovação.
    environment:
      name: producao

    steps:
      - name: Baixar o artefato validado
        uses: actions/download-artifact@v4
        with:
          name: pacote-cotacao
          path: dist/

      - name: Listar o que será publicado
        run: ls -lh dist/

      # Deploy simulado: em um projeto real, aqui entraria o twine, o
      # kubectl, o ArgoCD ou o comando do seu provedor de nuvem.
      - name: Deploy (simulado)
        run: |
          echo "Publicando os artefatos abaixo em produção:"
          ls dist/
          echo "Deploy concluído com sucesso."
