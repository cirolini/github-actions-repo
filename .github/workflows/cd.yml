# Workflow 3 de 3 — ENTREGA CONTÍNUA
# Um artefato, construído UMA vez, promovido por dois ambientes:
#   empacotar -> homologacao (automático) -> producao (com aprovação)
# Isso é ENTREGA contínua. Sem a aprovação em producao, seria IMPLANTAÇÃO contínua.
name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empacotar:
    name: Gerar artefato
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Nunca gere artefato de código quebrado.
      - name: Validar antes de empacotar
        env:
          PYTHONPATH: src
        run: |
          ruff check .
          python -m unittest discover -s tests

      - name: Construir o pacote
        run: python -m build

      # SBOM — a lista de ingredientes do software.
      #
      # Instalamos as dependências de execução em um ambiente limpo e
      # inventariamos esse ambiente. O resultado é o ponto que o slide 19
      # defende: requirements.txt tem UMA linha, e o SBOM lista cinco
      # componentes. As outras quatro vieram junto, ninguém as escolheu,
      # e são tão suas quanto o código que você escreveu.
      #
      # É esse arquivo que responde "estamos afetados?" em segundos quando
      # sai uma CVE — em vez de dias de busca repositório por repositório.
      - name: Gerar SBOM (CycloneDX)
        run: |
          # Ambiente limpo com as dependências de EXECUÇÃO (não as de
          # desenvolvimento): é isso que vai para produção.
          python -m venv .runtime
          ./.runtime/bin/pip install --quiet -r requirements.txt
          ./.runtime/bin/pip freeze > runtime-frozen.txt
          cyclonedx-py requirements runtime-frozen.txt \
            --of JSON --sv 1.6 -o dist/sbom.cdx.json
          echo "requirements.txt declara:"
          sed 's/^/  /' requirements.txt
          echo "O SBOM lista:"
          python -c "import json;d=json.load(open('dist/sbom.cdx.json'));[print('  -',c['name'],c.get('version')) for c in sorted(d['components'],key=lambda x:x['name'])]"

      # O SBOM viaja junto com o pacote. Artefato e inventário são a mesma
      # entrega: saber o que foi publicado faz parte de publicar.
      - name: Publicar artefato e SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacote-cotacao
          path: dist/
          retention-days: 30

  homologacao:
    name: Implantar em homologação
    needs: empacotar
    runs-on: ubuntu-latest
    # Ambiente sem aprovação: a promoção até homologação é automática.
    environment:
      name: homologacao

    steps:
      - name: Baixar o artefato validado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pacote-cotacao
          path: dist/

      - name: Deploy em homologação (simulado)
        run: |
          echo "Implantando em HOMOLOGAÇÃO:"
          ls -lh dist/
          echo "Homologação atualizada."

  producao:
    name: Publicar em produção
    needs: homologacao
    runs-on: ubuntu-latest
    # Configure em Settings > Environments > producao > Required reviewers
    # para que este job aguarde aprovação humana.
    environment:
      name: producao

    steps:
      # O MESMO artefato de antes: não é reconstruído entre ambientes.
      # É isso que garante que o que foi testado é o que vai para produção.
      - name: Baixar o mesmo artefato
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pacote-cotacao
          path: dist/

      - name: Deploy em produção (simulado)
        run: |
          echo "Implantando em PRODUÇÃO o mesmo pacote validado:"
          ls -lh dist/
          sha256sum dist/*.whl
          echo "Deploy concluído."

      # Vai para produção sabendo exatamente o que está sendo publicado.
      - name: Inventário do que foi publicado
        run: |
          echo "Componentes de terceiros nesta versão:"
          python -c "import json;d=json.load(open('dist/sbom.cdx.json'));[print(' -',c['name'],c.get('version')) for c in sorted(d['components'],key=lambda x:x['name'])]"
