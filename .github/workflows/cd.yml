# Workflow 3 de 3 — ENTREGA CONTÍNUA
# Um artefato, construído UMA vez, promovido por dois ambientes:
#   empacotar -> homologacao (automático) -> producao (com aprovação)
# Isso é ENTREGA contínua. Sem a aprovação em producao, seria IMPLANTAÇÃO contínua.
name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empacotar:
    name: Gerar artefato
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Nunca gere artefato de código quebrado.
      - name: Validar antes de empacotar
        env:
          PYTHONPATH: src
        run: |
          ruff check .
          python -m unittest discover -s tests

      - name: Construir o pacote
        run: python -m build

      - name: Publicar artefato
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacote-cotacao
          path: dist/
          retention-days: 30

  homologacao:
    name: Implantar em homologação
    needs: empacotar
    runs-on: ubuntu-latest
    # Ambiente sem aprovação: a promoção até homologação é automática.
    environment:
      name: homologacao

    steps:
      - name: Baixar o artefato validado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pacote-cotacao
          path: dist/

      - name: Deploy em homologação (simulado)
        run: |
          echo "Implantando em HOMOLOGAÇÃO:"
          ls -lh dist/
          echo "Homologação atualizada."

  producao:
    name: Publicar em produção
    needs: homologacao
    runs-on: ubuntu-latest
    # Configure em Settings > Environments > producao > Required reviewers
    # para que este job aguarde aprovação humana.
    environment:
      name: producao

    steps:
      # O MESMO artefato de antes: não é reconstruído entre ambientes.
      # É isso que garante que o que foi testado é o que vai para produção.
      - name: Baixar o mesmo artefato
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pacote-cotacao
          path: dist/

      - name: Deploy em produção (simulado)
        run: |
          echo "Implantando em PRODUÇÃO o mesmo pacote validado:"
          ls -lh dist/
          sha256sum dist/*.whl
          echo "Deploy concluído."
