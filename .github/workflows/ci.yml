# Workflow 1 de 3 — INTEGRAÇÃO CONTÍNUA
# Roda a cada push e a cada pull request. É a rede de segurança do time:
# se este workflow ficar vermelho, o código não entra na main.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Princípio do menor privilégio: este workflow só precisa ler o repositório.
permissions:
  contents: read

jobs:
  qualidade:
    name: Lint e testes
    runs-on: ubuntu-latest

    # Matriz: a mesma validação roda em três versões do Python.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      # 1. Traz o código do repositório para dentro do runner.
      - name: Checkout do código
        uses: actions/checkout@v6

      # 2. Instala a versão de Python desta linha da matriz.
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 3. Ambiente limpo: dependências declaradas e instaladas automaticamente.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 4. Análise estática: padrão de código e imports.
      - name: Analisar código (Ruff)
        run: ruff check --output-format=github .

      # 5. Formatação: falha se algum arquivo não estiver formatado.
      - name: Conferir formatação (Ruff)
        run: ruff format --check .

      # 6. Testes unitários — a espinha dorsal da integração contínua.
      - name: Rodar testes
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
