[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cotacao"
version = "1.0.0"
description = "Exemplo didático de esteira de CI/CD com GitHub Actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Os blocos de código do README/DEMO são ilustrativos e não devem ser formatados.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/W: pycodestyle · F: pyflakes · I: isort · B: bugbear · UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
